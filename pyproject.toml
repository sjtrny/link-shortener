[project]
name = "django-link-shortener"
version = "0.1.0"
description = "Admin-only Django link shortener"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "Django>=6.0.8,<6.1",
    "gunicorn==26.2.0",
    "qrcode[pil]>=8.2",
    "whitenoise==6.12.0",
]

[tool.uv]
# Security floors for dependencies of qrcode and Django.
constraint-dependencies = [
    "pillow>=12.3.0",
    "sqlparse>=0.6.0",
]
