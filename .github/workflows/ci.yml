name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: Workflow syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        shell: bash
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
      - name: Check workflow syntax
        run: |
          "$RUNNER_TEMP/actionlint" -color

  application:
    name: Application (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.1'
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Application, migration, and production configuration checks
        run: uv run --locked python ci/check.py

  dependencies:
    name: Locked dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.1'
          python-version: '3.13'
          enable-cache: false
      - name: Export the locked runtime requirements
        run: uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/requirements.txt"
      - name: Audit locked dependencies
        run: uvx pip-audit==2.10.1 --strict --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"

  container:
    name: Container lifecycle and image audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build the candidate image
        run: docker build --pull --build-arg VERSION=ci --build-arg REVISION="$GITHUB_SHA" --tag link-shortener:ci .
      - name: Build the upgrade baseline
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          revision="${BASE_REVISION:-HEAD^1}"
          if [[ "$revision" == 0000000000000000000000000000000000000000 ]]; then
            revision=HEAD^1
          fi
          git archive "$revision" | docker build --pull --tag link-shortener:baseline -
      - name: Fresh install, persistence, backup, restore, and upgrade
        run: python3 ci/container_smoke.py --image link-shortener:ci --upgrade-from link-shortener:baseline
      - name: Report image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: link-shortener:ci
          scanners: vuln
          format: table
          exit-code: '0'
          cache: 'false'
          timeout: 10m
      - name: Reject fixable high and critical image vulnerabilities
        run: >-
          trivy image --cache-dir .cache/trivy --scanners vuln --timeout 10m
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 link-shortener:ci

  publish:
    name: Publish amd64 image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [workflows, application, dependencies, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the image
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          pull: true
          provenance: mode=max
          sbom: generator=docker.io/docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          tags: |
            ghcr.io/sjtrny/link-shortener:latest
            ghcr.io/sjtrny/link-shortener:sha-${{ github.sha }}
          build-args: |
            VERSION=sha-${{ github.sha }}
            REVISION=${{ github.sha }}
      - name: Verify published tags and architecture
        env:
          EXPECTED_DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE_TAGS: |
            ghcr.io/sjtrny/link-shortener:latest
            ghcr.io/sjtrny/link-shortener:sha-${{ github.sha }}
        shell: bash
        run: |
          while IFS= read -r image_tag; do
            test -n "$image_tag" || continue
            manifest="$RUNNER_TEMP/manifest-${image_tag##*:}.json"
            docker buildx imagetools inspect "$image_tag" --format '{{json .Manifest}}' > "$manifest"
            python3 ci/verify_release_manifest.py \
              --manifest "$manifest" \
              --digest "$EXPECTED_DIGEST" \
              --platform linux/amd64
          done <<< "$IMAGE_TAGS"
